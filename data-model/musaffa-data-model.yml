- name: DividendPurification
  description: Per-share purification amount for a security's latest dividend.
  key: stock
  fields:
  - {name: non-compliant_revenue_ratio, type: number, unit: percent}
  - {name: dividend_per_share_for_quarter, type: number}
  - {name: dividend_purification_amount_per_share, type: number}
  formula: >-
    Dividend purification amount per share = Last Dividend per Share * (IR + QR) / 100, where IR is
    the impermissible revenue ratio and QR the questionable revenue ratio.
  note: >-
    This is the only entity in the API using snake_case field names; every other object is camelCase.
