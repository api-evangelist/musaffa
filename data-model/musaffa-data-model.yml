entity_count: 7
entities:
- name: Stock
  description: A covered equity security, keyed by ticker symbol.
  key: stockName
  key_alias: symbol
  key_note: >-
    The identifier field is named `stockName` in the list, bulk and related responses but `symbol` in
    the single-report response. Same concept, two names, in one document.
  identifier_format: >-
    Ticker, optionally suffixed with an exchange code (AAPL, DCII.JK, SSNNF, API.L). No separate
    exchange/MIC field is returned, so market must be inferred from the suffix.
  fields:
