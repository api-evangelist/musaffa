aid: musaffa
name: Musaffa
description: >-
  Musaffa is a New York-headquartered Islamic fintech that operates a halal investing platform and
  sells its underlying Shariah-compliance dataset to other businesses as the Musaffa B2B API. The
  company screens 120,000+ stocks and ETFs across 70+ global exchanges against an AAOIFI-based
  methodology and exposes the results — compliance status, a 0-5 compliance ranking, revenue
  breakdown, interest-bearing securities and debt ratios, dividend purification amounts and related
  securities — through a versioned REST API at platform.musaffa.com, plus an outbound webhook that
  pushes compliance-status changes to a subscriber URL. The B2B API is documented publicly at
  api.musaffa.com (v1, v2 and the current v3) but the API itself is sold through a demo/sales
  process: credentials are a client ID plus a shared secret issued per client, and there is no
  self-service signup for the API.
