apis:
- name: Musaffa B2B Shariah Compliance API
  description: >-
    REST API returning Shariah-compliance screening for stocks and ETFs — a compliance status and
    0-5 ranking per ticker, a full screening report with revenue breakdown and interest-bearing
    securities/debt ratios against AAOIFI thresholds, a bulk screening list (max 100 tickers per
    request), dividend purification amounts per share, and related securities. Authenticated with a
    per-client clientId plus a Base64(SHA-512(secretKey + time + body)) token header. An outbound
    webhook delivers compliance-status changes to a client-supplied URL.
  humanURL: https://api.musaffa.com/
  baseURL: https://platform.musaffa.com/b2b/api
