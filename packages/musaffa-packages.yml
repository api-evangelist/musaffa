summary: >-
  Musaffa ships no client library in any language. The API reference offers copy-paste request
  samples in shell (curl), Java (Spring RestTemplate) and Python (requests) — hand-rolled HTTP with
  the SHA-512 token computed inline — and that is the whole integration story. Because the auth
  scheme is a per-request signature over the exact serialized body, every consumer has to reimplement
  the same digest, which is precisely the work an SDK would remove. No SDKs pointer is emitted.
